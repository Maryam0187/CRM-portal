<svg width="280" height="80" viewBox="0 0 280 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular Emblem -->
  <g id="emblem">
    <!-- Circle base with gradient -->
    <circle cx="40" cy="40" r="28" fill="url(#circleGradient)"/>
    
    <!-- Left half: Circuit board pattern -->
    <g id="circuit" clip-path="url(#leftHalf)">
      <!-- Vertical traces -->
      <line x1="20" y1="20" x2="20" y2="35" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="28" y1="25" x2="28" y2="45" stroke="#84cc16" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="35" y1="30" x2="35" y2="55" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Horizontal traces -->
      <line x1="15" y1="28" x2="35" y2="28" stroke="#84cc16" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="18" y1="40" x2="38" y2="40" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="20" y1="52" x2="35" y2="52" stroke="#84cc16" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Connection nodes -->
      <circle cx="20" cy="28" r="2" fill="#84cc16"/>
      <circle cx="28" cy="28" r="2" fill="#84cc16"/>
      <circle cx="28" cy="40" r="2" fill="#22d3ee"/>
      <circle cx="35" cy="40" r="2" fill="#22d3ee"/>
      <circle cx="35" cy="52" r="2" fill="#84cc16"/>
    </g>
    
    <!-- Right half: Gear/Cog -->
    <g id="gear" clip-path="url(#rightHalf)">
      <!-- Main gear circle -->
      <circle cx="40" cy="40" r="12" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="40" cy="40" r="6" fill="none" stroke="#84cc16" stroke-width="2"/>
      
      <!-- Gear teeth (8 teeth) -->
      <rect x="38.5" y="20" width="3" height="6" fill="#84cc16" rx="1"/>
      <rect x="38.5" y="54" width="3" height="6" fill="#84cc16" rx="1"/>
      <rect x="54" y="38.5" width="6" height="3" fill="#22d3ee" rx="1"/>
      <rect x="20" y="38.5" width="6" height="3" fill="#22d3ee" rx="1"/>
      
      <!-- Diagonal teeth -->
      <rect x="52" y="26" width="3" height="5" fill="#84cc16" rx="1" transform="rotate(45 53.5 28.5)"/>
      <rect x="52" y="49" width="3" height="5" fill="#22d3ee" rx="1" transform="rotate(-45 53.5 51.5)"/>
      <rect x="25" y="26" width="3" height="5" fill="#22d3ee" rx="1" transform="rotate(-45 26.5 28.5)"/>
      <rect x="25" y="49" width="3" height="5" fill="#84cc16" rx="1" transform="rotate(45 26.5 51.5)"/>
    </g>
    
    <!-- Center dot -->
    <circle cx="40" cy="40" r="3" fill="#06b6d4"/>
  </g>
  
  <!-- Text: TECHNONAIRE -->
  <text x="90" y="35" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" 
        font-size="13" font-weight="600" letter-spacing="2" fill="#6b7280">
    TECHNONAIRE
  </text>
  
  <!-- Text: Business (serif, dark) -->
  <text x="90" y="58" font-family="Georgia, 'Times New Roman', serif" 
        font-size="28" font-weight="400" fill="#1f2937" font-style="normal">
    Business<tspan fill="#d97706" font-weight="500">OS</tspan>
  </text>
  
  <!-- Gradients and Masks -->
  <defs>
    <linearGradient id="circleGradient" x1="12" y1="12" x2="68" y2="68">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    
    <clipPath id="leftHalf">
      <rect x="12" y="12" width="28" height="56"/>
    </clipPath>
    
    <clipPath id="rightHalf">
      <rect x="40" y="12" width="28" height="56"/>
    </clipPath>
  </defs>
</svg>
