<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular Emblem (enlarged for favicon) -->
  <circle cx="32" cy="32" r="28" fill="url(#circleGradient)"/>
  
  <!-- Left half: Circuit board pattern -->
  <g id="circuit" clip-path="url(#leftHalf)">
    <!-- Vertical traces -->
    <line x1="14" y1="14" x2="14" y2="28" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="18" x2="22" y2="38" stroke="#84cc16" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="24" x2="28" y2="48" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Horizontal traces -->
    <line x1="10" y1="22" x2="28" y2="22" stroke="#84cc16" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="32" x2="30" y2="32" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="44" x2="28" y2="44" stroke="#84cc16" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Connection nodes -->
    <circle cx="14" cy="22" r="2.5" fill="#84cc16"/>
    <circle cx="22" cy="22" r="2.5" fill="#84cc16"/>
    <circle cx="22" cy="32" r="2.5" fill="#22d3ee"/>
    <circle cx="28" cy="32" r="2.5" fill="#22d3ee"/>
    <circle cx="28" cy="44" r="2.5" fill="#84cc16"/>
  </g>
  
  <!-- Right half: Gear/Cog -->
  <g id="gear" clip-path="url(#rightHalf)">
    <!-- Main gear circle -->
    <circle cx="32" cy="32" r="12" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="6" fill="none" stroke="#84cc16" stroke-width="2.5"/>
    
    <!-- Gear teeth (8 teeth) -->
    <rect x="30.5" y="12" width="3" height="7" fill="#84cc16" rx="1"/>
    <rect x="30.5" y="45" width="3" height="7" fill="#84cc16" rx="1"/>
    <rect x="45" y="30.5" width="7" height="3" fill="#22d3ee" rx="1"/>
    <rect x="12" y="30.5" width="7" height="3" fill="#22d3ee" rx="1"/>
    
    <!-- Diagonal teeth -->
    <rect x="44" y="18" width="3" height="6" fill="#84cc16" rx="1" transform="rotate(45 45.5 21)"/>
    <rect x="44" y="40" width="3" height="6" fill="#22d3ee" rx="1" transform="rotate(-45 45.5 43)"/>
    <rect x="18" y="18" width="3" height="6" fill="#22d3ee" rx="1" transform="rotate(-45 19.5 21)"/>
    <rect x="18" y="40" width="3" height="6" fill="#84cc16" rx="1" transform="rotate(45 19.5 43)"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3.5" fill="#06b6d4"/>
  
  <!-- Gradients and Masks -->
  <defs>
    <linearGradient id="circleGradient" x1="4" y1="4" x2="60" y2="60">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    
    <clipPath id="leftHalf">
      <rect x="4" y="4" width="28" height="56"/>
    </clipPath>
    
    <clipPath id="rightHalf">
      <rect x="32" y="4" width="28" height="56"/>
    </clipPath>
  </defs>
</svg>
