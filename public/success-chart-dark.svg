<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1F2937" rx="16"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#F9FAFB">
    Revenue Growth
  </text>
  <text x="24" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9CA3AF">
    Demo data - Example visualization
  </text>
  
  <!-- Stats Cards -->
  <g filter="url(#shadow)">
    <!-- Total Revenue -->
    <rect x="400" y="20" width="180" height="70" rx="12" fill="#374151"/>
    <text x="416" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9CA3AF">
      TOTAL REVENUE
    </text>
    <text x="416" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#F9FAFB">
      $24,580
    </text>
    <g>
      <path d="M550 60 L556 54 L562 60" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="520" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34D399">
        +28%
      </text>
    </g>
    
    <!-- Bookings -->
    <rect x="400" y="105" width="180" height="70" rx="12" fill="#374151"/>
    <text x="416" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9CA3AF">
      BOOKINGS
    </text>
    <text x="416" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#F9FAFB">
      1,248
    </text>
    <g>
      <path d="M550 145 L556 139 L562 145" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="520" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34D399">
        +42%
      </text>
    </g>
  </g>
  
  <!-- Chart Grid -->
  <line x1="40" y1="280" x2="370" y2="280" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="240" x2="370" y2="240" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="200" x2="370" y2="200" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="160" x2="370" y2="160" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="120" x2="370" y2="120" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Y-axis labels -->
  <text x="20" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="end">$30k</text>
  <text x="20" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="end">$20k</text>
  <text x="20" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="end">$10k</text>
  <text x="20" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="end">$5k</text>
  <text x="20" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="end">$0</text>
  
  <!-- Chart Area Fill -->
  <path d="M 40 270 L 95 265 L 150 250 L 205 240 L 260 210 L 315 180 L 370 120 L 370 320 L 40 320 Z" 
        fill="url(#chartGradient)"/>
  
  <!-- Chart Line -->
  <path d="M 40 270 L 95 265 L 150 250 L 205 240 L 260 210 L 315 180 L 370 120" 
        stroke="url(#lineGradient)" 
        stroke-width="3" 
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Data Points -->
  <circle cx="40" cy="270" r="5" fill="#1F2937" stroke="#60A5FA" stroke-width="3"/>
  <circle cx="95" cy="265" r="5" fill="#1F2937" stroke="#60A5FA" stroke-width="3"/>
  <circle cx="150" cy="250" r="5" fill="#1F2937" stroke="#6366F1" stroke-width="3"/>
  <circle cx="205" cy="240" r="5" fill="#1F2937" stroke="#7C3AED" stroke-width="3"/>
  <circle cx="260" cy="210" r="5" fill="#1F2937" stroke="#8B5CF6" stroke-width="3"/>
  <circle cx="315" cy="180" r="5" fill="#1F2937" stroke="#A78BFA" stroke-width="3"/>
  <circle cx="370" cy="120" r="6" fill="#1F2937" stroke="#A78BFA" stroke-width="3"/>
  
  <!-- X-axis labels -->
  <text x="40" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Jan</text>
  <text x="95" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Feb</text>
  <text x="150" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Mar</text>
  <text x="205" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Apr</text>
  <text x="260" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">May</text>
  <text x="315" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Jun</text>
  <text x="370" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Jul</text>
  
  <!-- X-axis line -->
  <line x1="40" y1="320" x2="370" y2="320" stroke="#4B5563" stroke-width="2"/>
  
  <!-- Hover highlight (decorative) -->
  <circle cx="370" cy="120" r="12" fill="#A78BFA" opacity="0.1">
    <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
